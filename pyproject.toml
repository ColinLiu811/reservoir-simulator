[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ressim"
version = "0.1.0"
description = "1D/2D finite-difference reservoir simulator: implicit single-phase flow and two-phase IMPES, validated against analytical solutions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ressim = "ressim.cli:main"

[tool.setuptools.packages.find]
include = ["ressim*"]

[tool.pytest.ini_options]
testpaths = ["tests", "ressim"]
addopts = "--doctest-modules"
